<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>InstaVibe - Social Media & Stories</title>
    <meta name="description" content="A responsive, feature-rich social media platform with interactive stories, feeds, reels, direct messages, photo filters, and explore discovery." />
    <meta name="keywords" content="social media, stories, reels, explore, photography, creators, community, messaging" />
    <meta name="author" content="InstaVibe Team" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://instavibe.app/" />

    <!-- PWA & Mobile Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="InstaVibe" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://instavibe.app/" />
    <meta property="og:site_name" content="InstaVibe" />
    <meta property="og:title" content="InstaVibe - Social Media & Stories" />
    <meta property="og:description" content="A responsive, feature-rich social media platform with interactive stories, feeds, reels, direct messages, photo filters, and explore discovery." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&h=630&q=85" />
    <meta property="og:image:alt" content="InstaVibe Preview Canvas" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InstaVibe - Social Media & Stories" />
    <meta name="twitter:description" content="A responsive, feature-rich social media platform with interactive stories, feeds, reels, direct messages, photo filters, and explore discovery." />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&h=630&q=85" />

    <!-- Performance: Preconnect & DNS-Prefetch for External CDNs & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    
    <!-- Optimized Font Loading with font-display: swap -->
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "InstaVibe",
        "url": "https://instavibe.app/",
        "description": "A responsive social media application featuring feeds, reels, stories, direct messaging, and discovery.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-50 antialiased selection:bg-pink-500 selection:text-white">
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif; background-color: #f3f4f6; color: #111827;">
        <h2>JavaScript Required</h2>
        <p>Please enable JavaScript in your browser to experience InstaVibe's interactive social feed, reels, and stories.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
